<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' sky:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' sky: data: blob:">
<title>Skyline mini player</title>
<link rel="stylesheet" href="css/mini.css">
<script src="js/boot.js"></script>
</head>
<body>
<div class="mini" id="mini">
  <div class="bd" data-np-backdrop></div>
  <div class="art"><div class="ph">♪</div><img data-np-art="main" alt=""></div>
  <div class="info">
    <div class="top"><span class="app" data-np-app>Music</span><span class="sp"></span>
      <button class="ib" id="open" title="Open Skyline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l4-3v14M9 21V4l6 3v14M15 21v-9l4 2v7"/></svg></button>
      <button class="ib" id="close" title="Close the mini player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
    <div class="title" data-np-title>Nothing playing</div>
    <div class="artist" data-np-artist></div>
    <div class="ctl">
      <button class="b" data-np="prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 6.2v11.6a1 1 0 0 1-1.55.83L9.2 12.83a1 1 0 0 1 0-1.66l8.25-5.8A1 1 0 0 1 19 6.2z"/></svg></button>
      <button class="b big" data-np="toggle" data-np-play title="Play"></button>
      <button class="b" data-np="next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 6.2v11.6a1 1 0 0 0 1.55.83l8.25-5.8a1 1 0 0 0 0-1.66L6.55 5.37A1 1 0 0 0 5 6.2z"/></svg></button>
      <span class="sp"></span><canvas class="viz" id="viz"></canvas>
    </div>
  </div>
  <div class="prog"><i id="fill"></i></div>
</div>
<script type="module" src="js/mini.js"></script>
</body>
</html>
