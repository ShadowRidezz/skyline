<!doctype html><html><head><meta charset="utf-8"><title>IXL | Solve two-step equations</title></head>
<!-- An IXL fill-in question, with one minus sign drawn in IXL's private font (it can't be read as text) and a graph image -->
<body><main><article class="practice-page">
  <h1 class="breadcrumb-skill-name">Solve two-step equations</h1>
  <div class="question-and-submission-view"><section class="ixl-practice-crate math">
    <p>Solve for <i>x</i>.</p>
    <p><span>3</span><i>x</i> <span>+</span> <span>4</span> <span>=</span> <span>&#xFFFD;</span><span>11</span></p>
    <p><i>x</i> = <input type="text" class="fillIn" value="typed answer must not be read"></p>
    <canvas width="300" height="120" style="width:300px;height:120px"></canvas>
    <button>Submit</button>
  </section></div>
</article></main></body></html>
